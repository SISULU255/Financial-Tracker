<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My Money</title>
<style>
:root{--in:#16a34a;--in2:#4ade80;--out:#f97316;--out2:#ef4444;--ink:#0b2a5b;--mut:#4a6ea3;--glass:rgba(255,255,255,.55);--line:rgba(255,255,255,.75)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--ink);min-height:100vh;background:radial-gradient(circle at 15% 0,#fff 0,transparent 40%),linear-gradient(165deg,#dbeafe,#7fb3fb 55%,#2563eb) fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.glass{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 32px rgba(30,64,175,.18)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:700}
#st{border:0;border-radius:99px;padding:8px 14px;font:600 12px inherit;font-family:inherit;color:var(--ink);cursor:pointer}
.bal{padding:26px 22px;text-align:center}
.bal small{color:var(--mut);font-weight:600}
#bal{font-size:44px;font-weight:800;letter-spacing:-1.5px;margin:6px 0 14px;word-break:break-word}
.row{display:flex;gap:10px}.row>*{flex:1}
.mini{padding:10px;border-radius:16px;background:rgba(255,255,255,.6);font-size:13px;color:var(--mut)}
.mini b{display:block;font-size:16px;margin-top:2px}
.in{color:var(--in)}.out{color:#ea580c}
.acts{margin:14px 0}
.big{border:0;border-radius:20px;padding:20px 8px;font:800 17px inherit;font-family:inherit;color:#fff;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.big:active{transform:scale(.97)}
.bi{background:linear-gradient(135deg,var(--in2),var(--in))}
.bo{background:linear-gradient(135deg,#fb923c,var(--out2))}
.tabs{display:flex;padding:5px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:19px;font:700 14px inherit;font-family:inherit;color:var(--mut);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(30,64,175,.15)}
.list{padding:6px 14px}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.7)}
.tx:last-child{border:0}
.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.dot.i{background:linear-gradient(135deg,var(--in2),var(--in))}.dot.o{background:linear-gradient(135deg,#fb923c,var(--out2))}
.tx .m{flex:1;min-width:0}.tx .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .m span{font-size:12px;color:var(--mut)}
.tx .a{font-weight:800}
.x{border:0;background:none;color:var(--mut);font-size:20px;cursor:pointer;padding:4px 6px}
.empty{padding:28px 10px;text-align:center;color:var(--mut)}
.rep{padding:18px}
.rep select,.rep input,.sheet input{font:600 15px inherit;font-family:inherit;color:var(--ink);padding:11px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.75);width:100%}
.rep .row{margin-bottom:14px}
.sum{display:grid;gap:8px;margin:14px 0}
.sum div{display:flex;justify-content:space-between;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.6)}
.pr{width:100%;margin-top:14px;border:0;border-radius:16px;padding:14px;background:var(--ink);color:#fff;font:700 15px inherit;font-family:inherit;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(11,42,91,.35);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.ov[hidden]{display:none}
.sheet{width:100%;max-width:560px;padding:22px 18px calc(22px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:rgba(255,255,255,.85);display:grid;gap:12px}
.sheet h2{margin:0;font-size:18px}
.sheet .amt{font-size:30px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid rgba(37,99,235,.25);background:rgba(255,255,255,.8);border-radius:99px;padding:8px 14px;font:600 13px inherit;font-family:inherit;color:var(--ink);cursor:pointer}
.chips button.on{background:var(--ink);color:#fff}
.save{border:0;border-radius:16px;padding:16px;color:#fff;font:800 16px inherit;font-family:inherit;cursor:pointer}
.cancel{border:0;background:none;color:var(--mut);font:600 14px inherit;font-family:inherit;cursor:pointer}
.pv{display:none}
@media print{body{background:#fff}.noprint,.tabs,.acts,header,.pr{display:none!important}.glass{box-shadow:none;backdrop-filter:none;background:#fff;border:0}#v-home{display:none!important}#v-rep{display:block!important}.rep .row{display:none}.pv{display:block;margin-bottom:8px}}
</style></head><body>
<div class="wrap">
<header><h1>My Money</h1><button id="st" class="glass" onclick="sync(true)">Local only</button></header>

<section class="glass bal noprint">
<small>Balance</small><div id="bal">0</div>
<div class="row"><div class="mini">In this month<b class="in" id="mi">0</b></div><div class="mini">Out this month<b class="out" id="mo">0</b></div></div>
</section>
<div class="row acts noprint"><button class="big bi" onclick="openSheet('in')">+ Money In</button><button class="big bo" onclick="openSheet('out')">− Money Out</button></div>
<nav class="tabs glass"><button class="on" id="t-home" onclick="tab('home')">History</button><button id="t-rep" onclick="tab('rep')">Report</button></nav>

<section id="v-home" class="glass list"></section>

<section id="v-rep" class="glass rep" hidden>
<div class="row"><select id="mode" onchange="render()"><option value="m">Month</option><option value="y">Year</option><option value="a">Since day one</option></select><input id="per" type="month" onchange="render()"></div>
<h2 class="pv" id="pv"></h2>
<div class="sum" id="sum"></div>
<div id="cats"></div>
<div id="rl"></div>
<button class="pr" onclick="window.print()">Print or save as PDF</button>
</section>
</div>

<div class="ov" id="ov" hidden onclick="if(event.target===this)closeSheet()">
<form class="sheet glass" onsubmit="add(event)">
<h2 id="sh"></h2>
<input class="amt" id="amt" inputmode="decimal" placeholder="0" required autocomplete="off">
<div class="chips" id="chips"></div>
<input id="note" placeholder="Note (optional)" maxlength="80" autocomplete="off">
<input id="dt" type="date" required>
<button class="save" id="sv">Save</button><button type="button" class="cancel" onclick="closeSheet()">Cancel</button>
</form></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// ===== SETTINGS =====
const CLIENT_ID='PASTE_YOUR_GOOGLE_CLIENT_ID_HERE'; // see setup steps
const CUR='TSh';
// ====================
const FILE='my-money-data.json',KEY='mt_data',TOK='mt_tok',CATS={in:['ATM','Salary','Gift','Other'],out:['Food','Transport','Bills','Shopping','Other']};
const $=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem(KEY))||{tx:[]}}catch(e){S={tx:[]}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const live=()=>S.tx.filter(t=>!t.del);
const fmt=n=>CUR+' '+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const sum=(a,k)=>a.filter(t=>t.k===k).reduce((s,t)=>s+t.a,0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

let kind='in',cat='';
function openSheet(k){kind=k;cat=CATS[k][0];$('#sh').textContent=k==='in'?'Money in':'Money out';
 $('#sv').style.background=k==='in'?'linear-gradient(135deg,#4ade80,#16a34a)':'linear-gradient(135deg,#fb923c,#ef4444)';
 $('#amt').style.color=k==='in'?'#16a34a':'#ea580c';$('#amt').value='';$('#note').value='';$('#dt').value=today();
 drawChips();$('#ov').hidden=false;setTimeout(()=>$('#amt').focus(),50)}
function drawChips(){$('#chips').innerHTML=CATS[kind].map(c=>`<button type="button" class="${c===cat?'on':''}" onclick="cat='${c}';drawChips()">${c}</button>`).join('')}
function closeSheet(){$('#ov').hidden=true}
function add(e){e.preventDefault();const a=parseFloat($('#amt').value.replace(/,/g,''));if(!(a>0))return;
 S.tx.push({id:uid(),k:kind,a,c:cat,n:$('#note').value.trim(),d:$('#dt').value,u:Date.now()});
 save();closeSheet();render();sync()}
function del(id){if(!confirm('Delete this entry?'))return;const t=S.tx.find(t=>t.id===id);t.del=1;t.u=Date.now();save();render();sync()}

function row(t,rep){return `<div class="tx"><div class="dot ${t.k==='in'?'i':'o'}">${t.k==='in'?'↓':'↑'}</div><div class="m"><b>${esc(t.n||t.c)}</b><span>${t.d} · ${esc(t.c)}</span></div><div class="a ${t.k==='in'?'in':'out'}">${t.k==='in'?'+':'−'}${fmt(t.a)}</div>${rep?'':`<button class="x noprint" onclick="del('${t.id}')" aria-label="Delete">×</button>`}</div>`}
const sorted=a=>a.slice().sort((x,y)=>y.d.localeCompare(x.d)||y.u-x.u);
function render(){
 const all=live(),ym=today().slice(0,7),mo=all.filter(t=>t.d.startsWith(ym));
 $('#bal').textContent=fmt(sum(all,'in')-sum(all,'out'));$('#mi').textContent=fmt(sum(mo,'in'));$('#mo').textContent=fmt(sum(mo,'out'));
 $('#v-home').innerHTML=all.length?sorted(all).slice(0,60).map(t=>row(t)).join(''):'<div class="empty">No entries yet.<br>Tap Money In to add your first one.</div>';
 if(!$('#per').value)$('#per').value=ym;
 const m=$('#mode').value,p=$('#per').value||ym;$('#per').style.display=m==='a'?'none':'';
 const pre=m==='m'?p:p.slice(0,4);
 const inP=m==='a'?all:all.filter(t=>t.d.startsWith(pre)),before=m==='a'?[]:all.filter(t=>t.d<pre);
 const open=sum(before,'in')-sum(before,'out'),i=sum(inP,'in'),o=sum(inP,'out');
 const label=m==='a'?'Since day one':m==='y'?'Year '+pre:new Date(p+'-01T00:00').toLocaleString('en',{month:'long',year:'numeric'});
 $('#pv').textContent='Money report · '+label;
 $('#sum').innerHTML=(m==='a'?'':`<div><span>Brought forward</span><b>${fmt(open)}</b></div>`)+`<div><span>Total money in</span><b class="in">${fmt(i)}</b></div><div><span>Total money out</span><b class="out">${fmt(o)}</b></div><div><span>Balance at end</span><b>${fmt(open+i-o)}</b></div>`;
 const by={};inP.filter(t=>t.k==='out').forEach(t=>by[t.c]=(by[t.c]||0)+t.a);
 $('#cats').innerHTML=o?'<h3>Spending by type</h3>'+Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="mini" style="margin-bottom:6px;display:flex;justify-content:space-between"><span>${esc(c)}</span><b class="out" style="display:inline;margin:0">${fmt(v)}</b></div>`).join(''):'';
 $('#rl').innerHTML=inP.length?'<h3>All entries</h3>'+sorted(inP).map(t=>row(t,1)).join(''):'<div class="empty">No entries in this period.</div>';
}
function tab(t){['home','rep'].forEach(x=>{$('#v-'+x).hidden=x!==t;$('#t-'+x).classList.toggle('on',x===t)});render()}

// ===== Google Drive sync (offline-first) =====
function setSt(t){$('#st').textContent=t}
function merge(rem){const m=new Map(S.tx.map(t=>[t.id,t]));rem.forEach(r=>{const l=m.get(r.id);if(!l||r.u>l.u)m.set(r.id,r)});S.tx=[...m.values()];save()}
function gtoken(){try{const t=JSON.parse(localStorage.getItem(TOK));if(t&&t.exp>Date.now()+6e4)return t.v}catch(e){}return null}
function signIn(silent){return new Promise((res,rej)=>{
 if(!window.google||!google.accounts)return rej(new Error('offline'));
 const c=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',
  callback:r=>{if(r.access_token){localStorage.setItem(TOK,JSON.stringify({v:r.access_token,exp:Date.now()+r.expires_in*1e3}));localStorage.setItem('mt_linked','1');res(r.access_token)}else rej(new Error('auth'))},
  error_callback:()=>rej(new Error('auth'))});
 c.requestAccessToken({prompt:silent?'none':''})})}
async function api(u,o,t){const r=await fetch(u,{...o,headers:{Authorization:'Bearer '+t,...(o&&o.headers)}});if(!r.ok)throw new Error(r.status);return r}
let busy=false;
async function sync(manual){
 if(!CLIENT_ID.includes('.')){setSt('Local only');return}
 if(!manual&&!localStorage.getItem('mt_linked')){setSt('Connect Drive');return}
 if(!navigator.onLine){setSt('Offline · will sync');return}
 if(busy)return;busy=true;setSt('Syncing…');
 try{
  const t=gtoken()||await signIn(!manual);
  const q=encodeURIComponent(`name='${FILE}' and trashed=false`);
  let id=((await(await api(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`,{},t)).json()).files[0]||{}).id;
  if(id){const r=await(await api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,{},t)).json();merge(r.tx||[]);render()}
  else id=(await(await api('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:FILE,mimeType:'application/json'})},t)).json()).id;
  await api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)},t);
  setSt('Saved to Drive ✓');
 }catch(e){localStorage.removeItem(TOK);setSt(navigator.onLine?'Tap to reconnect Drive':'Offline · will sync')}
 busy=false}
addEventListener('online',()=>sync());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
addEventListener('load',()=>setTimeout(sync,1200));
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
